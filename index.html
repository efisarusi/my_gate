<!DOCTYPE html>
<html lang="en">
<script>

let statusFlag1 = "!"; // Global variable to store the status
let statusFlag2 = "?"; // Global variable to store the status
let countdown = 10; // Countdown from 10
let countdownInterval = null; // Interval for countdown
let requestCount = 0; // Count of requests made
let errorCount = 0; // Count of errors

function updateButtonText() 
{
  const btn = document.getElementById('play-btn');
  if (countdown > 0) {
    btn.innerHTML = 'המתן....<br>' + countdown;
  } else {
    let errorText = errorCount > 0 ? '<br><span style="font-size: 20px;">❌ ' + errorCount + '</span>' : '';
    btn.innerHTML = 'שער' + errorText;
  }
}

async function fetchData2() 
{
	fetch('https://efisarusi1.pythonanywhere.com/')
    .then(response => response.text())
    .then(data => {
        if (data.includes("Successfully sent message")) 
		{
            console.log("Message sent passed!");
			statusFlag2 = "B"
        }
		else
		{
            console.log("Message sent failed!");
			statusFlag2 = "b"
			errorCount++;
		}
    })
    .catch(error => 
	{
		console.error('Error:X', error);	
		statusFlag2 = "b"
		errorCount++;
		updateButtonText();
	})
}
		
function post2()
{
	console.log("post2 - Request #" + (requestCount + 1));
	fetchData2();
}

function post1()
{
  console.error("post1 - DISABLED");
  // Removed access to https://62.0.30.39:22290 for security reasons
  statusFlag1 = "X"; // Disabled
  return;
}

function startCountdown() {
  countdown = 10;
  requestCount = 0;
  errorCount = 0; // Reset error count
  updateButtonText();
  
  // Disable button
  const btn = document.getElementById('play-btn');
  btn.disabled = true;
  
  // Make first request immediately
  post2();
  requestCount++;
  
  // Start countdown
  countdownInterval = setInterval(() => {
    countdown--;
    updateButtonText();
    
    // Make second request at countdown 5 (after 5 seconds)
    if (countdown === 5) {
      post2();
      requestCount++;
      // Play random sound at countdown 5
      var randomId = getRandomIdInRange(3500, 3600);
      playAudio(randomId);
    }
    
    if (countdown <= 0) {
      clearInterval(countdownInterval);
      btn.disabled = false;
      updateButtonText();
    }
  }, 1000);
}

function postData() 
{
	try 
	{
	 navigator.vibrate(200); // vibrate for 200ms
	}
	catch (error) 
	{
	  console.error(error);
	}

	// If already counting down, show patience message
	if (countdown > 0 && countdown < 10) {
	  const btn = document.getElementById('play-btn');
	  const originalText = btn.innerHTML;
	  btn.innerHTML = 'לנשום';
	  setTimeout(() => {
	    btn.innerHTML = originalText;
	  }, 500);
	  return;
	}

	post1();
	startCountdown();
}
</script>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="margin: 0; padding: 0; height: 100vh; overflow: hidden; position: relative;">

  <!-- Background image - covers entire page -->
  <img id="randomImage" src="" alt="Random funny image" 
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    ">

  <!-- Button container - positioned in bottom third -->
  <div style="
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 33.33vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  ">
    <button
      style="
        background-color: red;
        width: 60%;
        max-width: 300px;
        height: 150px;
        border-radius: 75px;
        cursor: pointer;
        font-size: 48px;
        font-weight: bold;
        color: white;
        border: 4px solid white;
        box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      "
      type="button"
      id="play-btn"
      onclick="changeColor()"
    >
      שער
    </button>
  </div>

  <audio id="audioSource">
    <source src="https://www.fesliyanstudios.com/soundeffects-download.php?id=3629" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>
  </body>
  <script>
	function getRandomColor() {
	  var letters = "0123456789ABCDEF";
	  var color = "#";
	  for (var i = 0; i < 6; i++) {
		color += letters[Math.floor(Math.random() * 16)];
	  }
	  return color;
	}
	function playAudio(id) {
      var audio = document.getElementById("audioSource");
      var source = document.getElementById("audioSource");
      source.src = `https://www.fesliyanstudios.com/soundeffects-download.php?id=`+id;
      audio.load();
      audio.play();
    }
	
  function getRandomIdInRange(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
	
    function changeColor() {
      var randomId = getRandomIdInRange(3500, 3600);
      playAudio(randomId);	
      
      document.getElementById("play-btn").style.backgroundColor = getRandomColor();
      postData();
    }
    
	window.onload = function () {
      document.getElementById("play-btn").style.backgroundColor = getRandomColor();
      
      // Load random image - changes on every page load
      const randomSeed = Math.floor(Math.random() * 10000);
      document.getElementById('randomImage').src = 'https://picsum.photos/seed/' + randomSeed + '/600/600';
    };

  </script>
</html>
